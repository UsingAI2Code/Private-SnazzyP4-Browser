<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#111827"><title>SnazzyP4 Mobile Companion</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><header><h1>⚡ SnazzyP4 Mobile</h1><div class="header-options"><select id="mode"><option value="classic">Classic</option><option value="simple" selected>Simple</option></select></div></header>
<section class="panel setup"><h2>Setup</h2><div class="row"><label>Role <select id="role"><option value="support">Support</option><option value="dps">DPS</option></select></label><label class="hide-complete-label"><input id="hideComplete" type="checkbox"> Hide Exdeath/Chaos when Complete</label></div></section>
<section class="panel exdeath"><h2 id="exheading">1st Exdeath</h2><div class="pair" id="exbuttons"></div><h2 class="debuff-heading">Debuffs</h2><div id="debuffs"></div></section>
<section class="panel chaos-panel"><h2>Chaos</h2><div id="chaos"></div></section>
<section class="panel kefka-panel"><h2>Kefka</h2><div id="kefka"></div></section>
<section class="panel results-panel"><h2>Resolutions</h2><div class="resultgrid"><div class="result"><h3>FIRST SET</h3><div id="first"></div></div><div class="result"><h3>SECOND SET</h3><div id="second"></div></div></div><div id="simplePanel" class="result extra-result hidden"><h3>DEBUFFS</h3><div id="simpleResults"></div></div><div class="result extra-result"><h3 id="extraTitle">KEFKA</h3><div id="extra"></div></div></section>
<div class="controls"><button id="undo">↶ Undo</button><button id="reset" class="danger">Reset pull</button></div>
<script src="app.js" defer></script></body></html>
